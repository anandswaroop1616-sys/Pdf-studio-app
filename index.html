<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Studio</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c2410c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f3ef;--sf:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#d9d7cf;--ac:#c2410c;--acx:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--sf:#232321;--tx:#f0efe9;--mu:#a09f97;--bd:#3a3a36;--ac:#fb923c;--acx:#1a1a18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--sf:#232321;--tx:#f0efe9;--mu:#a09f97;--bd:#3a3a36;--ac:#fb923c;--acx:#1a1a18;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0 8px 0 0;letter-spacing:-.01em}
h1 span{color:var(--ac)}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-left:8px;border-left:1px solid var(--bd)}
button,label.btn,select{font:inherit;font-size:13px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--ac)}
button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none}
input[type=file]{display:none}
#status{margin-left:auto;color:var(--mu);font-size:12px;max-width:260px}
main{padding:18px 12px 60px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:60vh}
#drop{margin:8vh auto;text-align:center;border:2px dashed var(--bd);border-radius:18px;padding:48px 28px;max-width:560px;color:var(--mu)}
#drop strong{display:block;color:var(--tx);font-size:20px;margin-bottom:6px}
#drop.over{border-color:var(--ac)}
.fmts{font-size:12px;margin-top:12px}
.pg{position:relative;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);max-width:100%}
.pg canvas{display:block}
.pg .ov{position:absolute;inset:0;touch-action:none}
.pgbar{position:absolute;top:-1px;right:-1px;display:flex;gap:4px;padding:4px;opacity:0;transition:.15s;z-index:3}
.pgwrap{position:relative;max-width:100%;overflow:auto}
.pgwrap:hover .pgbar,.pgwrap:focus-within .pgbar{opacity:1}
.pgbar button{padding:2px 8px;background:var(--sf)}
.num{position:absolute;left:6px;bottom:4px;font-size:11px;background:#000a;color:#fff;border-radius:6px;padding:0 6px;z-index:3}
.inv .pg{filter:invert(1)}
.inv.smart .pg{filter:invert(1) hue-rotate(180deg)}
.txt{position:absolute;border:1px dashed var(--ac);background:#fff;color:#000;font-family:Helvetica,Arial,sans-serif;padding:0;outline:none;z-index:5}
.doc{background:#fff;color:#111;width:min(900px,100%);padding:34px 40px;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.18);overflow:auto}
.doc table{border-collapse:collapse;font-size:13px}
.doc td,.doc th{border:1px solid #ccc;padding:3px 8px}
.doc pre{white-space:pre-wrap;word-break:break-word;margin:0;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace}
.doc img{max-width:100%}
.inv .doc{filter:invert(1)}.inv.smart .doc{filter:invert(1) hue-rotate(180deg)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <h1>PDF <span>Studio</span></h1>
  <div class="grp">
    <label class="btn">Open<input type="file" id="f" accept=".pdf,.docx,.xlsx,.xls,.csv,.tsv,.txt,.md,.json,.xml,.html,.htm,.log,.rtf,image/*"></label>
    <label class="btn" id="appL" title="Append another PDF">+ Merge PDF<input type="file" id="fm" accept=".pdf"></label>
  </div>
  <div class="grp" id="tools">
    <button data-t="view" class="on">Select</button>
    <button data-t="text">Text</button>
    <button data-t="draw">Draw</button>
    <button data-t="hl">Highlight</button>
    <button data-t="box">Whiteout</button>
    <input type="color" id="col" value="#d11a2a" title="Colour">
    <select id="size"><option value="14">14</option><option value="18">18</option><option value="24">24</option><option value="12">12</option></select>
  </div>
  <div class="grp">
    <button id="inv">Invert view</button>
    <label style="font-size:12px;color:var(--mu)"><input type="checkbox" id="smart" checked> keep hues</label>
  </div>
  <div class="grp" id="act">
    <button id="undo" disabled>Undo</button>
    <button id="save" class="pri" disabled>Save PDF</button>
    <button id="saveInv" disabled>Save inverted PDF</button>
  </div>
  <div id="status">Open a file to begin.</div>
</header>
<main id="main">
  <div id="drop"><strong>Drop a document here</strong>PDF to edit and invert; other formats to read.<div class="fmts">PDF · Word (.docx) · Excel (.xlsx/.xls/.csv) · Text/Markdown/JSON/XML/HTML · Images</div></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=s=>document.querySelector(s), main=$("#main"), SC=1.4;
let bytes=null, doc=null, anns={}, hist=[], tool="view", inverted=false, fname="document.pdf";

const status=t=>$("#status").textContent=t;
const hex2rgb=h=>PDFLib.rgb(parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255);
const dirty=()=>Object.values(anns).some(a=>a.length);
function setPdfUI(on){["save","saveInv"].forEach(i=>$("#"+i).disabled=!on);$("#tools").style.opacity=$("#appL").style.opacity=on?1:.4}
function setUndo(){$("#undo").disabled=!(hist.length||dirty())}
setPdfUI(false);

/* ---------- loading ---------- */
async function openFile(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase(), buf=await file.arrayBuffer();
  status("Reading "+file.name+"…");
  try{
    if(ext==="pdf"||file.type==="application/pdf"){fname=file.name;hist=[];await loadPdf(new Uint8Array(buf));}
    else{ setPdfUI(false); anns={}; await readOther(file,ext,buf); status(file.name+" — read-only view");}
  }catch(e){console.error(e);status("Couldn’t open this file: "+(e.message||e));}
}
async function loadPdf(u8){
  bytes=u8; anns={};
  doc=await pdfjsLib.getDocument({data:u8.slice()}).promise;
  await renderPdf(); setPdfUI(true); setUndo();
  status(fname+" — "+doc.numPages+" page"+(doc.numPages>1?"s":""));
}
async function renderPdf(){
  main.innerHTML="";
  for(let i=1;i<=doc.numPages;i++){
    const p=await doc.getPage(i), vp=p.getViewport({scale:SC});
    const wrap=document.createElement("div");wrap.className="pgwrap";
    const pg=document.createElement("div");pg.className="pg";pg.style.width=vp.width+"px";pg.style.height=vp.height+"px";pg.dataset.i=i-1;pg.dataset.w=vp.width/SC;pg.dataset.h=vp.height/SC;
    const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    const o=document.createElement("canvas");o.className="ov";o.width=vp.width;o.height=vp.height;
    pg.append(c,o);
    const bar=document.createElement("div");bar.className="pgbar";
    bar.innerHTML='<button title="Rotate">↻</button><button title="Delete page">✕</button>';
    bar.children[0].onclick=()=>pageOp(i-1,"rot");bar.children[1].onclick=()=>pageOp(i-1,"del");
    const n=document.createElement("div");n.className="num";n.textContent=i;
    wrap.append(pg,bar,n);main.append(wrap);
    p.render({canvasContext:c.getContext("2d"),viewport:vp});
    wire(o,i-1,pg);drawOv(o,i-1);
  }
}
async function readOther(file,ext,buf){
  main.innerHTML="";const d=document.createElement("div");d.className="doc";main.append(d);
  const text=()=>new TextDecoder().decode(buf);
  if(ext==="docx"){const r=await mammoth.convertToHtml({arrayBuffer:buf});d.innerHTML=r.value||"<em>Empty document</em>";}
  else if(["xlsx","xls","csv","tsv"].includes(ext)){
    const wb=XLSX.read(buf,{type:"array"});
    const tabs=document.createElement("div");tabs.className="tabs";const body=document.createElement("div");
    const show=n=>{body.innerHTML=XLSX.utils.sheet_to_html(wb.Sheets[n]);[...tabs.children].forEach(b=>b.classList.toggle("on",b.textContent===n))};
    wb.SheetNames.forEach(n=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>show(n);tabs.append(b)});
    d.append(tabs,body);show(wb.SheetNames[0]);
  }else if(file.type.startsWith("image/")){
    const img=new Image();img.src=URL.createObjectURL(file);d.append(img);
    const b=document.createElement("button");b.textContent="Convert image to PDF & edit";b.style.marginTop="12px";b.onclick=()=>imgToPdf(file,buf);d.append(b);
  }else if(ext==="json"){let t=text();try{t=JSON.stringify(JSON.parse(t),null,2)}catch{}const p=document.createElement("pre");p.textContent=t;d.append(p);}
  else if(ext==="doc"||ext==="ppt"||ext==="pptx"){d.innerHTML="<p>Legacy Office and PowerPoint files can’t be read in the browser. Please export them to PDF or .docx first.</p>";}
  else{const p=document.createElement("pre");p.textContent=text();d.append(p);}
}
async function imgToPdf(file,buf){
  const out=await PDFLib.PDFDocument.create();
  const im=file.type==="image/png"?await out.embedPng(buf):await out.embedJpg(buf).catch(async()=>{ // convert other formats via canvas
    const bm=await createImageBitmap(file),c=document.createElement("canvas");c.width=bm.width;c.height=bm.height;c.getContext("2d").drawImage(bm,0,0);
    return out.embedPng(await (await new Promise(r=>c.toBlob(r))).arrayBuffer());});
  const pg=out.addPage([im.width,im.height]);pg.drawImage(im,{x:0,y:0,width:im.width,height:im.height});
  fname=file.name.replace(/\.\w+$/,"")+".pdf";hist=[];await loadPdf(await out.save());
}

/* ---------- annotations ---------- */
function drawOv(o,i){
  const g=o.getContext("2d");g.clearRect(0,0,o.width,o.height);
  for(const a of anns[i]||[]){
    g.save();g.scale(SC,SC);
    if(a.t==="text"){g.fillStyle=a.c;g.font=a.s+"px Helvetica,Arial,sans-serif";g.textBaseline="top";a.txt.split("\n").forEach((l,k)=>g.fillText(l,a.x,a.y+k*a.s*1.2));}
    else if(a.t==="draw"){g.strokeStyle=a.c;g.lineWidth=a.w;g.lineCap=g.lineJoin="round";g.beginPath();a.p.forEach((q,k)=>k?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();}
    else if(a.t==="hl"){g.globalAlpha=.35;g.fillStyle=a.c;g.fillRect(a.x,a.y,a.w,a.h);}
    else if(a.t==="box"){g.fillStyle="#fff";g.fillRect(a.x,a.y,a.w,a.h);}
    g.restore();
  }
}
function wire(o,i,pg){
  let cur=null,sx,sy;
  const pt=e=>{const r=o.getBoundingClientRect();return[(e.clientX-r.left)/SC,(e.clientY-r.top)/SC]};
  o.onpointerdown=e=>{
    if(tool==="view")return;
    const [x,y]=pt(e);(anns[i]=anns[i]||[]);
    if(tool==="text"){addText(pg,i,x,y,o);return;}
    o.setPointerCapture(e.pointerId);sx=x;sy=y;
    cur=tool==="draw"?{t:"draw",c:$("#col").value,w:2,p:[[x,y]]}:{t:tool,c:tool==="hl"?"#ffe600":$("#col").value,x,y,w:0,h:0};
    anns[i].push(cur);
  };
  o.onpointermove=e=>{
    if(!cur)return;const [x,y]=pt(e);
    if(cur.t==="draw")cur.p.push([x,y]);else{cur.x=Math.min(sx,x);cur.y=Math.min(sy,y);cur.w=Math.abs(x-sx);cur.h=Math.abs(y-sy);}
    drawOv(o,i);
  };
  o.onpointerup=()=>{if(cur){cur=null;setUndo();}};
}
function addText(pg,i,x,y,o){
  const s=+$("#size").value,t=document.createElement("textarea");
  t.className="txt";t.style.cssText=`left:${x*SC}px;top:${y*SC}px;font-size:${s*SC}px;color:${$("#col").value};min-width:120px;height:${s*SC*1.5}px;resize:both`;
  pg.append(t);setTimeout(()=>t.focus(),0);
  const done=()=>{if(t.value.trim())anns[i].push({t:"text",x,y,s,c:$("#col").value,txt:t.value});t.remove();drawOv(o,i);setUndo();};
  t.onblur=done;t.onkeydown=e=>{if(e.key==="Escape"){t.value="";t.blur();}};
}
$("#undo").onclick=async()=>{
  const all=Object.keys(anns).filter(k=>anns[k].length);
  if(dirty()){ // remove last annotation added (most recent page touched)
    const k=all[all.length-1];anns[k].pop();const o=document.querySelectorAll(".ov")[k];drawOv(o,k);setUndo();
  }else if(hist.length){await loadPdf(hist.pop());setUndo();}
};
document.querySelectorAll("#tools [data-t]").forEach(b=>b.onclick=()=>{
  tool=b.dataset.t;document.querySelectorAll("#tools [data-t]").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".ov").forEach(o=>o.style.cursor=tool==="view"?"default":tool==="text"?"text":"crosshair");
});

/* ---------- PDF operations ---------- */
async function bake(){
  const d=await PDFLib.PDFDocument.load(bytes),font=await d.embedFont(PDFLib.StandardFonts.Helvetica);
  for(const k of Object.keys(anns)){
    const pg=d.getPage(+k),H=pg.getSize().height;
    for(const a of anns[k]){
      if(a.t==="text")a.txt.split("\n").forEach((l,n)=>pg.drawText(l.replace(/[^\x20-\xFF]/g,"?"),{x:a.x,y:H-a.y-a.s*(1+n*1.2)+a.s*.15,size:a.s,font,color:hex2rgb(a.c)}));
      else if(a.t==="draw")for(let q=1;q<a.p.length;q++)pg.drawLine({start:{x:a.p[q-1][0],y:H-a.p[q-1][1]},end:{x:a.p[q][0],y:H-a.p[q][1]},thickness:a.w,color:hex2rgb(a.c),lineCap:1});
      else if(a.t==="hl")pg.drawRectangle({x:a.x,y:H-a.y-a.h,width:a.w,height:a.h,color:hex2rgb(a.c),opacity:.35});
      else if(a.t==="box")pg.drawRectangle({x:a.x,y:H-a.y-a.h,width:a.w,height:a.h,color:PDFLib.rgb(1,1,1)});
    }
  }
  return d;
}
async function commit(mut){ // flatten annotations, apply mutation, reload, keep history
  const d=await bake();if(mut)await mut(d);
  hist.push(bytes);await loadPdf(await d.save());setUndo();
}
async function pageOp(i,op){
  if(op==="del"&&doc.numPages<2){status("Can’t delete the only page.");return;}
  await commit(async d=>{if(op==="del")d.removePage(i);else{const p=d.getPage(i);p.setRotation(PDFLib.degrees((p.getRotation().angle+90)%360));}});
}
$("#fm").onchange=async e=>{const f=e.target.files[0];if(!f)return;const o=await PDFLib.PDFDocument.load(await f.arrayBuffer());
  await commit(async d=>{(await d.copyPages(o,o.getPageIndices())).forEach(p=>d.addPage(p));});e.target.value="";};

/* ---------- invert + export ---------- */
$("#inv").onclick=()=>{inverted=!inverted;main.classList.toggle("inv",inverted);$("#inv").classList.toggle("on",inverted);};
$("#smart").onchange=e=>main.classList.toggle("smart",e.target.checked);main.classList.add("smart");

async function save(blobData,name){
  let dl=null;try{dl=await claude.use("downloads");}catch{}
  if(dl){try{await dl.save({filename:name,data:blobData});status("Saved "+name);}catch(e){status("Save failed: "+(e.message||e.code));}return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blobData);a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);status("Saved "+name);
}
$("#save").onclick=async()=>{status("Building PDF…");const d=await bake();await save(new Blob([await d.save()],{type:"application/pdf"}),fname.replace(/\.pdf$/i,"")+"-edited.pdf");};
$("#saveInv").onclick=async()=>{
  status("Inverting pages…");
  const d=await bake(),src=await pdfjsLib.getDocument({data:(await d.save())}).promise,out=await PDFLib.PDFDocument.create(),smart=$("#smart").checked;
  for(let i=1;i<=src.numPages;i++){
    const p=await src.getPage(i),vp=p.getViewport({scale:2}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);
    await p.render({canvasContext:g,viewport:vp}).promise;
    const im=g.getImageData(0,0,c.width,c.height),a=im.data;
    for(let k=0;k<a.length;k+=4){
      let r=255-a[k],gg=255-a[k+1],b=255-a[k+2];
      if(smart){const m=Math.max(a[k],a[k+1],a[k+2])+Math.min(a[k],a[k+1],a[k+2]);r=m-a[k];gg=m-a[k+1];b=m-a[k+2];} // flips lightness, keeps hue
      a[k]=r;a[k+1]=gg;a[k+2]=b;
    }
    g.putImageData(im,0,0);
    const jpg=await (await new Promise(r=>c.toBlob(r,"image/jpeg",.92))).arrayBuffer();
    const pw=p.getViewport({scale:1}),pg=out.addPage([pw.width,pw.height]);
    pg.drawImage(await out.embedJpg(jpg),{x:0,y:0,width:pw.width,height:pw.height});
    status("Inverting page "+i+"/"+src.numPages+"…");
  }
  await save(new Blob([await out.save()],{type:"application/pdf"}),fname.replace(/\.pdf$/i,"")+"-inverted.pdf");
};

/* ---------- input ---------- */
$("#f").onchange=e=>{if(e.target.files[0])openFile(e.target.files[0]);e.target.value="";};
["dragover","dragenter"].forEach(ev=>addEventListener(ev,e=>{e.preventDefault();$("#drop")?.classList.add("over")}));
["dragleave","drop"].forEach(ev=>addEventListener(ev,e=>{e.preventDefault();$("#drop")?.classList.remove("over")}));
addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)openFile(f);});
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
</html>
